name: Refresh and deploy

# Weekly refresh (Monday 06:17 UTC), manual trigger and every push to main:
# re-fetch recent data, rebuild, test, commit the refreshed derived data and
# deploy, in one workflow (pushes made with GITHUB_TOKEN do not trigger other
# workflows). A source that fails keeps its last snapshot and is marked stale;
# the deploy runs even if the refresh fails, publishing the last tested state.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-liberation
          python -m pip install -r requirements-dev.txt

      - name: Fetch and rebuild (a source that fails keeps its last snapshot and is marked stale)
        run: python -m pipeline all

      - name: Test and check
        run: |
          python -m pytest -q
          python scripts/check_site.py

      - name: Commit refreshed derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived data/raw/fred data/raw/worldbank data/raw/manifest.json data/AUDIT.md site
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly data refresh $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    if: always()
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-liberation
          python -m pip install -r requirements-dev.txt

      - name: Build the research note and check the site
        run: |
          python -m pipeline report
          python -m pipeline export
          python scripts/check_site.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
