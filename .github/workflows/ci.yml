name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-liberation
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check ironarb pipeline tests scripts
          ruff format --check ironarb pipeline tests scripts

      - name: Tests (engine, anchors, JavaScript parity)
        run: python -m pytest -q

      - name: Rebuild model outputs and the research note from committed data
        run: |
          python -m pipeline model
          python -m pipeline report
          python -m pipeline export

      - name: Site check (references, data, syntax, long dashes, placeholders)
        run: python scripts/check_site.py

      - name: Upload the research note
        uses: actions/upload-artifact@v4
        with:
          name: research-note
          path: |
            site/downloads/Iron-Ore-China-Import-Arbitrage-Research-Note.pdf
            data/cache/report/*.png
          retention-days: 30
