name: Build research note

# Manual trigger: rebuild the research note PDF from the committed data and
# commit it to the branch the workflow runs on. The weekly refresh does the same
# on main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  note:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-liberation
          python -m pip install -r requirements-dev.txt

      - name: Build the note and the downloads listing
        run: |
          python -m pipeline report
          python -m pipeline export
          python scripts/check_site.py

      - name: Commit the note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/downloads/Iron-Ore-China-Import-Arbitrage-Research-Note.pdf site/data/downloads.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build the research note"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
